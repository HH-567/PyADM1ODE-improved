name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: pyadm1 core tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the three packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./PyADM1ODE
          python -m pip install --no-deps -e ./PyADM1ODE_calibration -e ./PyADM1ODE_estimate
          # pytest-cov is required: pyproject.toml puts --cov=pyadm1 in addopts.
          python -m pip install pytest pytest-asyncio pytest-cov

      - name: Run the core test suite
        working-directory: PyADM1ODE
        run: python -m pytest tests -q --no-cov

      # The Julia backend is optional: without juliacall installed its tests
      # skip themselves, the rest of the suite still has to pass.
