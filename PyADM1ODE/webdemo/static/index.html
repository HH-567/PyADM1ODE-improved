<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyADM1ODE · 厌氧消化可视化平台</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/plotly.min.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">AD</div>
    <div class="titles">
      <h1>PyADM1ODE</h1>
      <p>厌氧消化模型 · 可视化操作平台</p>
    </div>
  </div>
  <nav class="topnav">
    <a href="/engine" target="_blank" rel="noopener">求解引擎</a>
    <a href="/trace" target="_blank" rel="noopener">三通道</a>
    <a href="/system" target="_blank" rel="noopener">组件系统</a>
    <a href="/calibration" target="_blank" rel="noopener">参数标定</a>
    <a href="/estimation" target="_blank" rel="noopener">状态估计</a>
    <a href="/online" target="_blank" rel="noopener">在线更正</a>
  </nav>
  <div class="badges">
    <span class="badge" id="badge-model">ADM1da · 41 状态</span>
    <span class="badge" id="badge-version">v0.6.2</span>
    <span class="badge accent" id="badge-backend">scipy</span>
  </div>
</header>

<div class="layout">

  <aside class="sidebar">
    <section class="card">
      <h2>进料配比</h2>
      <div id="feed-rows" class="feed-rows"></div>
      <button id="add-feed" class="btn tiny ghost">+ 添加基质</button>
      <div class="feed-total">总进料 <strong id="feed-total">0.0</strong> <span>m³/d</span></div>
    </section>

    <section class="card">
      <h2>消化器参数</h2>
      <div class="field">
        <label for="temp">温度 <output id="temp-out">42.0</output> <span class="unit">°C</span></label>
        <input type="range" id="temp" min="20" max="60" step="0.5" value="42">
      </div>
      <div class="field">
        <label for="vliq">液体体积 <span class="unit">m³</span></label>
        <input type="number" id="vliq" min="100" max="20000" step="50" value="1050">
      </div>
      <div class="field">
        <label for="vgas">气室体积 <span class="unit">m³</span></label>
        <input type="number" id="vgas" min="10" max="5000" step="10" value="150">
      </div>
      <div class="field">
        <label for="kla">传质系数 k<sub>L</sub>a <output id="kla-out">200</output> <span class="unit">d⁻¹</span></label>
        <input type="range" id="kla" min="10" max="800" step="10" value="200">
      </div>
    </section>

    <section class="card">
      <h2>仿真设置</h2>
      <div class="field two">
        <div>
          <label for="duration">天数 <span class="unit">d</span></label>
          <input type="number" id="duration" min="10" max="1000" step="10" value="150">
        </div>
        <div>
          <label for="dt">步长 dt <span class="unit">d</span></label>
          <input type="number" id="dt" min="0.25" max="5" step="0.25" value="1">
        </div>
      </div>
      <div class="field">
        <label for="backend">求解器</label>
        <select id="backend">
          <option value="scipy">scipy · BDF（默认）</option>
          <option value="adm1jl">ADM1jl · Rodas4P（Julia）</option>
        </select>
      </div>
    </section>

    <div class="actions">
      <button id="run" class="btn primary">开始仿真</button>
      <button id="compare" class="btn">两求解器对比</button>
      <button id="reset" class="btn ghost">恢复默认</button>
    </div>
    <div id="status" class="status">就绪</div>
  </aside>

  <main class="main">

    <section class="card schematic">
      <svg viewBox="0 0 1350 150" preserveAspectRatio="xMidYMid meet" role="img" aria-label="工艺流程示意">
        <defs>
          <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#0f766e" stop-opacity="0.85"/>
          </linearGradient>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b4654"/>
          </marker>
        </defs>

        <!-- feed -->
        <rect x="60" y="42" width="170" height="70" rx="10" class="sv-box"/>
        <text x="145" y="70" class="sv-title">进料</text>
        <text x="145" y="92" class="sv-value" id="sv-feed">22.5 m³/d</text>

        <!-- arrow -->
        <line x1="236" y1="77" x2="362" y2="77" class="sv-pipe" marker-end="url(#arrow)"/>

        <!-- digester -->
        <rect x="370" y="22" width="330" height="110" rx="14" class="sv-box strong"/>
        <rect x="374" y="70" width="322" height="58" rx="10" fill="url(#liquid)"/>
        <circle cx="460" cy="110" r="4" class="bubble b1"/>
        <circle cx="540" cy="118" r="3" class="bubble b2"/>
        <circle cx="620" cy="106" r="5" class="bubble b3"/>
        <circle cx="668" cy="116" r="3" class="bubble b4"/>
        <text x="535" y="44" class="sv-title">厌氧消化器</text>
        <text x="535" y="62" class="sv-sub" id="sv-digester">1050 m³ · 42.0 °C</text>

        <!-- gas out -->
        <line x1="706" y1="60" x2="826" y2="60" class="sv-pipe gas" marker-end="url(#arrow)"/>

        <!-- gas holder -->
        <circle cx="900" cy="76" r="54" class="sv-box"/>
        <circle cx="900" cy="76" r="54" fill="none" class="sv-ring"/>
        <text x="900" y="71" class="sv-title">沼气</text>
        <text x="900" y="93" class="sv-value gas" id="sv-gas">— Nm³/d</text>

        <!-- separator -->
        <line x1="1010" y1="24" x2="1010" y2="132" stroke="#1f2836" stroke-width="1"/>

        <!-- live indicators -->
        <g class="sv-indicators">
          <text x="1050" y="46" class="sv-label">pH</text>
          <text x="1110" y="46" class="sv-ind" id="sv-ph">—</text>
          <text x="1050" y="72" class="sv-label">CH₄</text>
          <text x="1110" y="72" class="sv-ind" id="sv-ch4">—</text>
          <text x="1050" y="98" class="sv-label">HRT</text>
          <text x="1110" y="98" class="sv-ind" id="sv-hrt">—</text>
          <text x="1050" y="124" class="sv-label">VFA</text>
          <text x="1110" y="124" class="sv-ind" id="sv-vfa">—</text>
        </g>
      </svg>
    </section>

    <section class="kpis" id="kpis"></section>

    <section class="charts">
      <div class="card chart"><h3>产气速率</h3><div id="chart-gas" class="plot"></div></div>
      <div class="card chart"><h3>甲烷占比</h3><div id="chart-pct" class="plot"></div></div>
      <div class="card chart"><h3>pH</h3><div id="chart-ph" class="plot"></div></div>
      <div class="card chart"><h3>VFA / TAC</h3><div id="chart-vfa" class="plot"></div></div>
    </section>

    <section class="card compare" id="compare-panel" hidden>
      <h2>求解器对比</h2>
      <div id="compare-body"></div>
    </section>

    <footer class="footer">
      <span id="run-meta">尚未仿真</span>
      <div class="footer-actions">
        <button id="export" class="btn tiny ghost" disabled>导出 CSV</button>
      </div>
    </footer>

  </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
