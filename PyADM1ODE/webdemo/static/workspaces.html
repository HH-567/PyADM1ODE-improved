<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PyADM1ODE · 工作区</title>
<link rel="stylesheet" href="/static/lab.css" />
<style>
  .stage { grid-template-rows: auto auto minmax(0, 1fr); }
  .btn { cursor: pointer; font-family: var(--mono); font-size: 12px; color: #eaf3fc;
    background: #123033; border: 1px solid rgba(111,227,212,.45); border-radius: 7px; padding: 9px 10px; width: 100%; }
  .btn:hover:not(:disabled) { background: #17403f; border-color: #6fe3d4; }
  .btn.ghost { background: #0b0e13; border-color: var(--line2); color: var(--muted); }
  .btn-mini { font-family: var(--mono); font-size: 11px; padding: 3px 8px; cursor: pointer;
    width: auto; display: inline-block; margin-right: 4px;
    background: #0b0e13; color: var(--muted); border: 1px solid var(--line2); border-radius: 6px; }
  .btn-mini:hover { color: #eaf3fc; border-color: var(--accent); }
  .btn-mini.danger:hover { color: #ff8a8a; border-color: #ff8a8a; }
  table.ws { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; }
  table.ws th, table.ws td { padding: 7px 9px; border-bottom: 1px solid rgba(190,215,240,.07); text-align: left; }
  table.ws th { color: var(--muted); font-weight: 500; }
  tr.on td { background: rgba(111,227,212,.07); }
  .badge-on { font-size: 10px; padding: 1px 7px; border-radius: 999px; background: #6fe3d4; color: #061018; font-weight: 600; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="dot">AD</div>
    <div>
      <h1>工作区</h1>
      <p>WORKSPACES · 一个工作区就是一个可以随时接着跑的大会话</p>
    </div>
  </div>
  <div class="spacer"></div>
  <a class="back" href="/">← 返回仪表盘</a>
</header>

<main class="layout">
  <aside class="panel">
    <h2>新建工作区</h2>
    <div class="field"><label for="name">名称</label><input id="name" type="text" placeholder="例：一号罐 2026 冬季" /></div>
    <div class="field"><label for="note">说明</label><input id="note" type="text" placeholder="原料来源、罐号、负责人…" /></div>
    <button id="create" class="btn">创建并切换</button>

    <h2 style="margin-top:16px">当前工作区</h2>
    <div class="note" id="active-info">—</div>

    <div class="status" id="status">工作区把装置状态、天数、曲线和加料记录存在自己的目录里；服务重启后自动恢复。</div>
  </aside>

  <section class="stage">
    <div class="kpis">
      <div class="kpi"><b>工作区数</b><strong id="k-total">—</strong></div>
      <div class="kpi"><b>当前</b><strong id="k-active">—</strong></div>
      <div class="kpi"><b>存储</b><strong id="k-store">—</strong></div>
    </div>
    <div class="banner" id="hint" style="font-family:var(--mono); font-size:11.5px; color:var(--muted)">
      每个工作区一个目录：meta.json（元数据）+ daily.json（装置状态与曲线）+ sensors.json（传感器记录）。
    </div>
    <div class="chart" style="padding: 8px 12px; overflow: auto">
      <table class="ws" id="table"></table>
    </div>
  </section>
</main>

<script src="/static/workspaces.js"></script>
</body>
</html>
